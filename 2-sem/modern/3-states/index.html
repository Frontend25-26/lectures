<!doctype html>
<html lang="ru">
<head>

    <title>Управление состоянием приложения</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #191919;
            font-family: sans-serif;
            color: #fff;
            text-align: center;
        }
        .message {
            max-width: 480px;
            padding: 2em;
        }
        h1 {
            font-size: 1.6em;
            margin-bottom: 0.5em;
        }

            color: #aaa;
            line-height: 1.6;
        }

</head>
<body>
    <div class="message">
        <h1>Лекция ещё не загружена</h1>
        <p>По вопросам пишите в чат или лектору.</p>
    </div>

</html>
